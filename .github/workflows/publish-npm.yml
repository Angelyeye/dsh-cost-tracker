# 通过 GitHub Actions 用 OIDC 可信发布（trusted publishing）发到 npm。
#
# 好处：不在仓库/Secrets 里存任何长期 npm token —— GitHub 直接签发一次性凭据。
#
# ⚠️ 启用前必须在 npmjs.com 上先配好「可信发布者」，否则本工作流会失败：
#   1. 打开 https://www.npmjs.com/package/@angelyeye/dsh-cost-tracker/access
#      （或包页面 → Settings → Trusted Publisher）
#   2. 选择 GitHub Actions，填写：
#        Organization or user : Angelyeye
#        Repository           : dsh-cost-tracker
#        Workflow filename    : publish-npm.yml        ← 必须与本文件名逐字一致
#        Environment          : （留空）
#   3. 保存。此后本工作流即可免 token 发布。
#
# 发布方式：Actions 页面手动触发（workflow_dispatch）。
# 之所以不写成 tag push 自动触发：发布是不可逆的公开动作，
# 手动触发可以避免误推标签导致意外发布。
#
# 依赖：npm CLI ≥ 11.5.1（OIDC 可信发布的最低版本）。Node 24 自带的 npm 满足要求。
#
# === 2026-09-15 排障记录：为什么第一次发布失败（E404）===
# 症状：
#   npm error 404 Not Found - PUT https://registry.npmjs.org/@angelyeye%2fdsh-cost-tracker
#   npm error 404 The requested resource '@angelyeye/dsh-cost-tracker@1.8.0' could not be
#                 found or you do not have permission to access it.
#
# 原因：actions/setup-node 一旦给了 registry-url，就会写出这样的 ~/.npmrc：
#     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
#     always-auth=true
# 本仓库没有任何 Actions secret（total_count = 0），于是 NODE_AUTH_TOKEN 是个占位值。
# npm 看到 .npmrc 里「已经配了令牌」，就认为要走令牌认证，**不再尝试 OIDC**，
# 结果以未认证身份 PUT → npm 对无权限的发布统一回 404（而不是 401/403）。
#
# 修法：① 去掉 registry-url（默认 registry 本来就是 registry.npmjs.org，不需要它）；
#       ② 再加一道清理，删掉任何残留的 _authToken，并断言 OIDC 环境变量存在。
# 这样 npm CLI 才会用 ACTIONS_ID_TOKEN_REQUEST_URL 去换一次性发布凭据。

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发布（dry run）
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 发布凭据所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不要设 registry-url：它会写入带 _authToken 的 .npmrc，
      # 从而让 npm 走令牌认证、绕过 OIDC 可信发布（见文件顶部排障记录）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 发布前必须全绿 —— 包括 client-registration.test.js，
      # 它正是拦住「注册 id 与包名不一致」那类回归的那道闸。
      - name: Run tests
        run: npm test

      - name: Show npm version
        run: npm --version

      # 双保险：确保没有任何 _authToken 残留，否则 OIDC 会被静默跳过
      - name: Ensure OIDC (no npm auth token)
        run: |
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "authToken = '$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null)'"
          node -e "if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL) { console.error('OIDC 环境不可用：缺少 id-token: write 权限'); process.exit(1) } console.log('OIDC 环境可用 ✓')"

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
