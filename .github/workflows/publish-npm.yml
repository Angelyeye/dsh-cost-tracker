# 通过 GitHub Actions 用 OIDC 可信发布（trusted publishing）发到 npm。
#
# 好处：不在仓库/Secrets 里存任何长期 npm token —— GitHub 直接签发一次性凭据。
#
# ⚠️ 启用前必须在 npmjs.com 上先配好「可信发布者」，否则本工作流会失败：
#   1. 打开 https://www.npmjs.com/package/@angelyeye/dsh-cost-tracker/access
#      （或包页面 → Settings → Trusted Publisher）
#   2. 选择 GitHub Actions，填写：
#        Organization or user : Angelyeye
#        Repository           : dsh-cost-tracker
#        Workflow filename    : publish-npm.yml        ← 必须与本文件名逐字一致
#        Environment          : （留空）
#   3. 保存。此后本工作流即可免 token 发布。
#
# 发布方式：Actions 页面手动触发（workflow_dispatch）。
# 之所以不写成 tag push 自动触发：发布是不可逆的公开动作，
# 手动触发可以避免误推标签导致意外发布。
#
# 依赖：npm CLI ≥ 11.5.1（OIDC 可信发布的最低版本）。Node 24 自带的 npm 满足要求。
#
# ============================================================
# 2026-09-15 排障记录（三次失败，症状各不相同）
# ============================================================
# ① 首次：E404 Not Found - PUT .../@angelyeye%2fdsh-cost-tracker
#    原因：actions/setup-node 给了 registry-url 就会写出
#          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
#          always-auth=true
#    而本仓库没有任何 Actions secret，NODE_AUTH_TOKEN 是占位值 →
#    npm 认为「已配令牌」走令牌认证、跳过 OIDC，以未认证身份 PUT，
#    npm 对无权限发布统一回 404。
#    修法：去掉 registry-url（默认 registry 本就是 registry.npmjs.org）。
#
# ② 第二次：ENEEDAUTH need auth
#    此时 .npmrc 已干净、authToken 为空，但 npm 直接报「需要登录」。
#
# ③ 第三次：加了诊断步骤后确认——环境其实是完美的：
#      Node v24.20.0 / npm 11.19.0（远高于 11.5.1 最低要求）
#      ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN 均已注入
#      userconfig /home/runner/.npmrc 不存在（无任何令牌残留）
#      手动向 GitHub 换 audience=npm:registry.npmjs.org 的 OIDC 令牌 → HTTP 200，拿到 1972 字符
#      npm config 里的 `_auth = (protected)` 经比对只是 npm 的默认掩码，不是残留凭据
#    但 npm publish 全程没有提到过一次 OIDC，直接 ENEEDAUTH。
#
#    结论：npm 侧已是正确配置，剩下的唯一可能是 npmjs.com 上
#    **尚未为该包配置 Trusted Publisher**（npm 只在发布那一刻校验，
#    配置缺失/工作流文件名对不上/Environment 对不上，都表现为同样的
#    404 或 ENEEDAUTH，日志里不会指出是哪一项）。
#
#    因此：必须先在 npmjs.com 配好可信发布者，本工作流才可能成功。
#    确认配置好后，重跑本工作流即可；诊断步骤会继续留证。
# ============================================================

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发布（dry run）
        type: boolean
        default: false

permissions:
  contents: write # 发布成功后创建 GitHub Release 与 tag（2026-09-24 起）
  id-token: write # OIDC 换取 npm 发布凭据所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不要设 registry-url：它会写入带 _authToken 的 .npmrc，
      # 从而让 npm 走令牌认证、绕过 OIDC 可信发布（见顶部排障记录 ①）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 发布前必须全绿 —— 包括 client-registration.test.js，
      # 它正是拦住「注册 id 与包名不一致」那类回归的那道闸。
      - name: Run tests
        run: npm test

      # 双保险：确保没有任何 _authToken 残留，否则 OIDC 会被静默跳过
      - name: Ensure OIDC (no npm auth token)
        run: |
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          node -e "if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL) { console.error('OIDC 环境不可用：缺少 id-token: write 权限'); process.exit(1) } console.log('OIDC 环境可用 ✓')"

      # 诊断：一旦再出现 404 / ENEEDAUTH，这几行就能立刻区分是
      # 「环境问题」还是「npmjs.com 没配可信发布者」
      - name: Diagnose OIDC readiness
        if: ${{ !inputs.dry_run }}
        run: |
          echo "node $(node --version) / npm $(npm --version)"
          UC="$(npm config get userconfig 2>/dev/null)"
          if [ -f "$UC" ]; then echo "userconfig $UC 存在"; sed -E 's/(_authToken=).*/\1<redacted>/' "$UC"; else echo "userconfig $UC 不存在（无令牌残留）"; fi
          # 2026-09-20 排障：npm 只要在环境里看到任何 npm 认证变量（哪怕是占位串），
          # 就会认为「已配令牌」而**跳过 OIDC**，最终以未认证身份发布 → ENEEDAUTH。
          # 这里只打印变量名（值一律不打印），便于确认是否有残留。
          echo '--- npm/认证相关环境变量（仅名字）---'
          env | grep -iE '^(node_auth|npm_|npm_config)' | sed -E 's/=.*/=<set>/' || echo '(无)'
          npm config list -l 2>/dev/null | grep -iE '(_auth|registry|provenance)' || true
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            -o /tmp/oidc.json -w 'OIDC 交换 HTTP %{http_code}\n'
          node -e "try{const j=require('/tmp/oidc.json');console.log('拿到 npm 受众 OIDC 令牌:', !!j.value)}catch(e){console.log('OIDC 令牌解析失败:', e.message)}"

      # 2026-09-20 排障：npm 的 OIDC 流程**从不抛错** —— 交换失败时它静默回落成
      # 「无令牌」，最终只报 ENEEDAUTH（看不出原因）。这一步按 npm 自己的实现
      # （lib/utils/oidc.js）复刻一次「OIDC → npm 令牌」交换，把 HTTP 状态与响应体
      # 打出来（响应里的 token 字段打码），从而区分：
      #   · 404/401 且带 npm 的说明 → npmjs.com 侧可信发布者配置不匹配（需在网站上修）
      #   · 200 且拿到 token     → 配置正常，问题在 npm CLI / 环境
      - name: Probe npm OIDC token exchange
        if: ${{ !inputs.dry_run }}
        run: |
          set -o pipefail
          IDTOKEN=$(node -e "console.log(require('/tmp/oidc.json').value || '')" 2>/dev/null || true)
          if [ -z "$IDTOKEN" ]; then echo '没有 id_token，跳过交换探测'; exit 0; fi
          PKG='@angelyeye/dsh-cost-tracker'
          ESCAPED='@angelyeye%2fdsh-cost-tracker'
          echo "POST https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESCAPED"
          curl -sS -X POST \
            -H "Authorization: Bearer $IDTOKEN" \
            -H 'content-type: application/json' \
            -o /tmp/exchange.json -w '交换 HTTP %{http_code}\n' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESCAPED" || true
          echo '--- 响应体（token 字段已打码）---'
          sed -E 's/("token"[[:space:]]*:[[:space:]]*")[^"]*/\1<redacted>/g' /tmp/exchange.json 2>/dev/null | head -c 800 || true
          echo
          echo "包名：$PKG"

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      # ⚠️ 关键：用 `env -u` **彻底移除**认证变量（不是置空）——空串同样会让 npm
      # 走令牌认证、跳过 OIDC；`--loglevel verbose` 让 npm 自己的 oidc 日志可见
      # （它会打印交换失败的真实原因），`--provenance` 强制走 OIDC 签名。
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: env -u NODE_AUTH_TOKEN -u NODE_AUTH -u NPM_TOKEN -u NPM_AUTH_TOKEN npm publish --access public --provenance --loglevel verbose

      # 2026-09-24 新增：发布成功后自动建 GitHub Release（此前本工作流只做 npm publish，
      # Releases 页因此从手动建的 v1.7.0 之后一直空着：1.7.1–1.9.2 共 18 个版本没有 Release）。
      # 备注取自 CHANGELOG.md 中该版本的章节（scripts/release-notes.mjs）；章节缺失时回落
      # 到 GitHub 自动生成备注并打 warning —— 已经发布成功的事实不该因此变成一次红色失败。
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 用 node 直接读 package.json：npm pkg get 在部分 shell 下可能取不到值，
          # 一旦退化成空串就会去建一个名为 "v" 的非法 tag（本地模拟时真实踩到过，被 GitHub 422 挡下）。
          # `|| true` 是必要的：读取失败不能因 set -e 让「已经发布成功」的这次运行变成红色失败，
          # 失败会在下面的版本号守卫里被判出来并只打告警。
          VERSION="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)' 2>/dev/null || true)"
          TAG="v$VERSION"
          # 版本号守卫：不合规就只告警跳过 —— 发布已经成功，不该因此变成红色失败。
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "::warning::package.json 里的版本号异常（'$VERSION'），跳过 Release 创建"
            exit 0
          fi
          NOTES=/tmp/release-notes.md
          TITLE="v$VERSION"
          if node scripts/release-notes.mjs --version "$VERSION" > "$NOTES"; then
            NOTES_ARGS=(--notes-file "$NOTES")
            # 标题取章节首行（形如 `**修复……**`），去掉加粗标记；过长时截断并加省略号
            HEADLINE_FULL="$(head -n 1 "$NOTES" | sed 's/^\*\*//; s/\*\*$//' | tr -d '\r')"
            HEADLINE="$(printf '%s' "$HEADLINE_FULL" | cut -c1-60)"
            if [ -n "$HEADLINE" ] && [ "$HEADLINE" != "$HEADLINE_FULL" ]; then HEADLINE="$HEADLINE…"; fi
            if [ -n "$HEADLINE" ]; then TITLE="v$VERSION — $HEADLINE"; fi
          else
            echo "::warning::CHANGELOG.md 缺少 v$VERSION 的章节，改用 GitHub 自动生成的备注"
            NOTES_ARGS=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新备注"
            gh release edit "$TAG" --title "$TITLE" "${NOTES_ARGS[@]}"
          else
            gh release create "$TAG" --title "$TITLE" --target "$GITHUB_SHA" "${NOTES_ARGS[@]}"
          fi
          gh release view "$TAG" --json tagName,name,url,isDraft,isPrerelease
