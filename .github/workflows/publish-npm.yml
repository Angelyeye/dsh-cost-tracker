# 通过 GitHub Actions 用 OIDC 可信发布（trusted publishing）发到 npm。
#
# 好处：不在仓库/Secrets 里存任何长期 npm token —— GitHub 直接签发一次性凭据。
#
# ⚠️ 启用前必须在 npmjs.com 上先配好「可信发布者」，否则本工作流会失败：
#   1. 打开 https://www.npmjs.com/package/@angelyeye/dsh-cost-tracker/access
#      （或包页面 → Settings → Trusted Publisher）
#   2. 选择 GitHub Actions，填写：
#        Organization or user : Angelyeye
#        Repository           : dsh-cost-tracker
#        Workflow filename    : publish-npm.yml        ← 必须与本文件名逐字一致
#        Environment          : （留空）
#   3. 保存。此后本工作流即可免 token 发布。
#
# 发布方式：Actions 页面手动触发（workflow_dispatch）。
# 之所以不写成 tag push 自动触发：发布是不可逆的公开动作，
# 手动触发可以避免误推标签导致意外发布。
#
# 依赖：npm CLI ≥ 11.5.1（OIDC 可信发布的最低版本）。Node 24 自带的 npm 满足要求。
#
# ============================================================
# 2026-09-15 排障记录（三次失败，症状各不相同）
# ============================================================
# ① 首次：E404 Not Found - PUT .../@angelyeye%2fdsh-cost-tracker
#    原因：actions/setup-node 给了 registry-url 就会写出
#          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
#          always-auth=true
#    而本仓库没有任何 Actions secret，NODE_AUTH_TOKEN 是占位值 →
#    npm 认为「已配令牌」走令牌认证、跳过 OIDC，以未认证身份 PUT，
#    npm 对无权限发布统一回 404。
#    修法：去掉 registry-url（默认 registry 本就是 registry.npmjs.org）。
#
# ② 第二次：ENEEDAUTH need auth
#    此时 .npmrc 已干净、authToken 为空，但 npm 直接报「需要登录」。
#
# ③ 第三次：加了诊断步骤后确认——环境其实是完美的：
#      Node v24.20.0 / npm 11.19.0（远高于 11.5.1 最低要求）
#      ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN 均已注入
#      userconfig /home/runner/.npmrc 不存在（无任何令牌残留）
#      手动向 GitHub 换 audience=npm:registry.npmjs.org 的 OIDC 令牌 → HTTP 200，拿到 1972 字符
#      npm config 里的 `_auth = (protected)` 经比对只是 npm 的默认掩码，不是残留凭据
#    但 npm publish 全程没有提到过一次 OIDC，直接 ENEEDAUTH。
#
#    结论：npm 侧已是正确配置，剩下的唯一可能是 npmjs.com 上
#    **尚未为该包配置 Trusted Publisher**（npm 只在发布那一刻校验，
#    配置缺失/工作流文件名对不上/Environment 对不上，都表现为同样的
#    404 或 ENEEDAUTH，日志里不会指出是哪一项）。
#
#    因此：必须先在 npmjs.com 配好可信发布者，本工作流才可能成功。
#    确认配置好后，重跑本工作流即可；诊断步骤会继续留证。
# ============================================================

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发布（dry run）
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 发布凭据所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不要设 registry-url：它会写入带 _authToken 的 .npmrc，
      # 从而让 npm 走令牌认证、绕过 OIDC 可信发布（见顶部排障记录 ①）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 发布前必须全绿 —— 包括 client-registration.test.js，
      # 它正是拦住「注册 id 与包名不一致」那类回归的那道闸。
      - name: Run tests
        run: npm test

      # 双保险：确保没有任何 _authToken 残留，否则 OIDC 会被静默跳过
      - name: Ensure OIDC (no npm auth token)
        run: |
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          node -e "if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL) { console.error('OIDC 环境不可用：缺少 id-token: write 权限'); process.exit(1) } console.log('OIDC 环境可用 ✓')"

      # 诊断：一旦再出现 404 / ENEEDAUTH，这几行就能立刻区分是
      # 「环境问题」还是「npmjs.com 没配可信发布者」
      - name: Diagnose OIDC readiness
        if: ${{ !inputs.dry_run }}
        run: |
          echo "node $(node --version) / npm $(npm --version)"
          UC="$(npm config get userconfig 2>/dev/null)"
          if [ -f "$UC" ]; then echo "userconfig $UC 存在"; sed -E 's/(_authToken=).*/\1<redacted>/' "$UC"; else echo "userconfig $UC 不存在（无令牌残留）"; fi
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            -o /tmp/oidc.json -w 'OIDC 交换 HTTP %{http_code}\n'
          node -e "try{const j=require('/tmp/oidc.json');console.log('拿到 npm 受众 OIDC 令牌:', !!j.value)}catch(e){console.log('OIDC 令牌解析失败:', e.message)}"

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
