# 通过 GitHub Actions 用 OIDC 可信发布（trusted publishing）发到 npm。
#
# 好处：不在仓库/Secrets 里存任何长期 npm token —— GitHub 直接签发一次性凭据。
#
# ⚠️ 启用前必须在 npmjs.com 上先配好「可信发布者」，否则本工作流会失败：
#   1. 打开 https://www.npmjs.com/package/@angelyeye/dsh-cost-tracker/access
#      （或包页面 → Settings → Trusted Publisher）
#   2. 选择 GitHub Actions，填写：
#        Organization or user : Angelyeye
#        Repository           : dsh-cost-tracker
#        Workflow filename    : publish-npm.yml        ← 必须与本文件名逐字一致
#        Environment          : （留空）
#   3. 保存。此后本工作流即可免 token 发布。
#
# 发布方式：Actions 页面手动触发（workflow_dispatch）。
# 之所以不写成 tag push 自动触发：发布是不可逆的公开动作，
# 手动触发可以避免误推标签导致意外发布。
#
# 依赖：npm CLI ≥ 11.5.1（OIDC 可信发布的最低版本）。Node 24 自带的 npm 满足要求。

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发布（dry run）
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 发布凭据所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 发布前必须全绿 —— 包括 client-registration.test.js，
      # 它正是拦住「注册 id 与包名不一致」那类回归的那道闸。
      - name: Run tests
        run: npm test

      - name: Show npm version
        run: npm --version

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
