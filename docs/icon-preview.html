<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>花费统计 图标预览</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; }
  .row { display: flex; gap: 32px; align-items: flex-end; margin-bottom: 28px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell span { font-size: 11px; color: #888; }
  .box { display: inline-flex; padding: 10px; border-radius: 10px; }
  .light { background: #f5f5f5; color: #1f2329; }
  .dark  { background: #1f2329; color: #e5e7eb; }
  h3 { margin: 18px 0 10px; }
  /* 模拟导航行 */
  .nav { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
         border-radius: 12px; font-size: 14px; width: 160px; }
  .nav.light:hover, .nav.light { background: #ececec; }
  .nav.dark { background: #2b2f36; }
</style>
</head>
<body>

<!-- ============ 方案 A：上升柱状图 + 趋势箭头 ============ -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="iconA">
      <rect x="1.4"  y="10.4" width="2.9" height="4"   rx="0.8" fill="currentColor"/>
      <rect x="6.0"  y="8.2"  width="2.9" height="6.2" rx="0.8" fill="currentColor"/>
      <rect x="10.6" y="6.0"  width="2.9" height="8.4" rx="0.8" fill="currentColor"/>
      <path d="M2.3 7.4 L6.6 4.6 L9.1 6.0 L13.5 1.9" fill="none" stroke="currentColor"
            stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11.6 1.9 L13.5 1.9 L13.5 3.8" fill="none" stroke="currentColor"
            stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ============ 方案 B：上升柱状图 + ¥ 硬币徽章 ============ -->
    <mask id="yenCut">
      <rect width="16" height="16" fill="black"/>
      <circle cx="12.4" cy="4.1" r="3.45" fill="white"/>
      <g stroke="black" stroke-width="0.95" stroke-linecap="round">
        <path d="M10.9 2.3 L12.4 4.2"/>
        <path d="M13.9 2.3 L12.4 4.2"/>
        <path d="M12.4 4.2 L12.4 6.3"/>
        <path d="M11.1 4.35 L13.7 4.35"/>
        <path d="M11.1 5.45 L13.7 5.45"/>
      </g>
    </mask>
    <g id="iconB">
      <rect x="1.3" y="10.2" width="2.8" height="4.2" rx="0.8" fill="currentColor"/>
      <rect x="5.0" y="7.8"  width="2.8" height="6.6" rx="0.8" fill="currentColor"/>
      <rect x="8.7" y="9.2"  width="2.8" height="5.2" rx="0.8" fill="currentColor"/>
      <circle cx="12.4" cy="4.1" r="3.45" fill="currentColor" mask="url(#yenCut)"/>
    </g>

    <!-- ============ 方案 C：¥ 硬币 + 微柱状 ============ -->
    <mask id="yenCutC">
      <rect width="16" height="16" fill="black"/>
      <circle cx="7.2" cy="7.2" r="6.2" fill="white"/>
      <g stroke="black" stroke-width="1.5" stroke-linecap="round">
        <path d="M4.6 3.9 L7.2 7.0"/>
        <path d="M9.8 3.9 L7.2 7.0"/>
        <path d="M7.2 7.0 L7.2 10.6"/>
        <path d="M4.9 7.4 L9.5 7.4"/>
        <path d="M4.9 9.3 L9.5 9.3"/>
      </g>
    </mask>
    <g id="iconC">
      <circle cx="7.2" cy="7.2" r="6.2" fill="currentColor" mask="url(#yenCutC)"/>
      <rect x="11.3" y="9.4"  width="1.9" height="5.0" rx="0.7" fill="currentColor"/>
      <rect x="13.9" y="7.2"  width="1.9" height="7.2" rx="0.7" fill="currentColor"/>
    </g>

    <!-- ============ 方案 D：双柱 + 描边 ¥ ============ -->
    <g id="iconD">
      <rect x="1.5" y="8.6" width="3.1" height="5.9" rx="0.9" fill="currentColor"/>
      <rect x="5.9" y="5.2" width="3.1" height="9.3" rx="0.9" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.7 4.9 L12.3 7.2 L13.9 4.9"/>
        <path d="M12.3 7.2 L12.3 10.9"/>
        <path d="M10.9 7.8 L13.7 7.8"/>
        <path d="M10.9 9.5 L13.7 9.5"/>
      </g>
    </g>
  </defs>
</svg>

<h3>方案 A：柱状图 + 趋势箭头</h3>
<div class="row">
  <div class="cell"><div class="box light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconA"/></svg></div><span>16</span></div>
  <div class="cell"><div class="box light"><svg width="24" height="24" viewBox="0 0 16 16"><use href="#iconA"/></svg></div><span>24</span></div>
  <div class="cell"><div class="box light"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconA"/></svg></div><span>48</span></div>
  <div class="cell"><div class="box dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconA"/></svg></div><span>16 dark</span></div>
  <div class="cell"><div class="box dark"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconA"/></svg></div><span>48 dark</span></div>
</div>

<h3>方案 B：柱状图 + ¥ 徽章</h3>
<div class="row">
  <div class="cell"><div class="box light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconB"/></svg></div><span>16</span></div>
  <div class="cell"><div class="box light"><svg width="24" height="24" viewBox="0 0 16 16"><use href="#iconB"/></svg></div><span>24</span></div>
  <div class="cell"><div class="box light"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconB"/></svg></div><span>48</span></div>
  <div class="cell"><div class="box dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconB"/></svg></div><span>16 dark</span></div>
  <div class="cell"><div class="box dark"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconB"/></svg></div><span>48 dark</span></div>
</div>

<h3>方案 C：¥ 硬币 + 微柱状</h3>
<div class="row">
  <div class="cell"><div class="box light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconC"/></svg></div><span>16</span></div>
  <div class="cell"><div class="box light"><svg width="24" height="24" viewBox="0 0 16 16"><use href="#iconC"/></svg></div><span>24</span></div>
  <div class="cell"><div class="box light"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconC"/></svg></div><span>48</span></div>
  <div class="cell"><div class="box dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconC"/></svg></div><span>16 dark</span></div>
  <div class="cell"><div class="box dark"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconC"/></svg></div><span>48 dark</span></div>
</div>

<h3>方案 D：双柱 + 描边 ¥</h3>
<div class="row">
  <div class="cell"><div class="box light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconD"/></svg></div><span>16</span></div>
  <div class="cell"><div class="box light"><svg width="24" height="24" viewBox="0 0 16 16"><use href="#iconD"/></svg></div><span>24</span></div>
  <div class="cell"><div class="box light"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconD"/></svg></div><span>48</span></div>
  <div class="cell"><div class="box dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconD"/></svg></div><span>16 dark</span></div>
  <div class="cell"><div class="box dark"><svg width="48" height="48" viewBox="0 0 16 16"><use href="#iconD"/></svg></div><span>48 dark</span></div>
</div>

<h3>导航行效果（与现有栏目并排）</h3>
<div class="row">
  <div class="nav light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconA"/></svg>花费统计</div>
  <div class="nav light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconB"/></svg>花费统计</div>
  <div class="nav light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconC"/></svg>花费统计</div>
  <div class="nav light"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconD"/></svg>花费统计</div>
</div>
<div class="row">
  <div class="nav dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconA"/></svg>花费统计</div>
  <div class="nav dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconB"/></svg>花费统计</div>
  <div class="nav dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconC"/></svg>花费统计</div>
  <div class="nav dark"><svg width="16" height="16" viewBox="0 0 16 16"><use href="#iconD"/></svg>花费统计</div>
</div>

</body>
</html>
